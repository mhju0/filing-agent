<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filing · 공통 아이콘 비교</title><link rel="stylesheet" href="digest-base.css"><link rel="stylesheet" href="study.css"><link rel="stylesheet" href="agent.css"><style>
.icon-study{width:var(--page);margin:60px auto}.icon-study h1{font-size:clamp(2rem,4vw,3.4rem)!important;line-height:1.4}.icon-study>p{color:var(--ink-muted);max-width:680px}.icon-pair{display:grid;grid-template-columns:1fr 1fr;gap:64px;margin:60px 0}.icon-pair article{border-top:1px solid var(--border);padding:28px 0}.icon-pair h2{font:500 24px var(--body)!important;letter-spacing:-.03em}.icon-display{height:210px;display:flex;align-items:center;gap:28px}.app-icon{width:144px;height:144px;border-radius:29px;overflow:hidden;position:relative;background:#f7f4ee;border:1px solid #8f8b82}.app-icon>img{width:100%;height:100%;object-fit:contain}.app-icon .family-mark{position:absolute;left:30px;right:30px;top:42px}.app-icon .family-mark img{width:84px;height:60px}.app-icon .agent-mark i{width:17px;height:11px;right:-9px;bottom:-10px;border-width:3px}.app-icon.agent-tile{background:#edf0f1}.tiny-pair{display:flex;align-items:center;gap:20px;color:var(--ink)}.tiny-pair img{width:24px;height:18px}.tiny-pair .agent-mark{--accent:#365d76}.icon-caption{font:13px/1.8 var(--body);color:var(--ink-muted)}.brand-sample{border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:22px 0;display:flex;align-items:center;gap:16px;font:600 13px var(--body);letter-spacing:.12em}.brand-sample img{width:40px;height:28px}.shared-rules{padding:32px;background:var(--paper-sunken);margin-top:40px}.shared-rules p{margin:0;line-height:1.9}.icon-study .agent-mark{--accent:#365d76}.icon-study article:nth-child(2){--accent:#365d76}.icon-study article:first-child .brand-sample{color:var(--ink)}.icon-study article:nth-child(2) .brand-sample{color:var(--ink)}@media(max-width:700px){.icon-pair{grid-template-columns:1fr;gap:24px;margin-top:32px}.icon-display{height:180px}.icon-study{margin-top:32px}.shared-rules{padding:24px}}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/digest-mark.png" alt="" width="488" height="346"><span>FILING</span></a></header><main><section class="icon-study" id="icons"><h1 id="title"></h1><p id="intro"></p><div class="icon-pair"><article><h2>Filing Digest</h2><div class="icon-display"><div class="app-icon"><img src="assets/digest-app-icon.png" alt="기존 Filing Digest 앱 아이콘"></div><div class="tiny-pair"><img src="assets/digest-mark.png" alt="Digest 작은 크기 표식"><span>24 px</span></div></div><div class="brand-sample"><img src="assets/digest-mark.png" alt="">FILING DIGEST</div><p class="icon-caption" id="digest-caption"></p></article><article><h2>Filing Agent</h2><div class="icon-display"><div class="app-icon agent-tile"><span class="family-mark agent-mark"><img src="assets/digest-mark.png" alt="Agent 앱 아이콘 제안"><i></i></span></div><div class="tiny-pair"><span class="family-mark agent-mark"><img src="assets/digest-mark.png" alt="Agent 작은 크기 표식"><i></i></span><span>24 px</span></div></div><div class="brand-sample"><span class="family-mark agent-mark"><img src="assets/digest-mark.png" alt=""><i></i></span>FILING AGENT</div><p class="icon-caption" id="agent-caption"></p></article></div><div class="shared-rules"><p id="rules"></p></div></section></main><script type="module">
import {setup,pair,variant} from './common.js';
const details=[['열린 모서리','an open corner'],['이어지는 두 줄','two continuation rules'],['짧은 밑줄','a short underline'],['한 겹 더한 괄호','an offset bracket'],['작은 정사각형','a small square']];
setup(()=>{document.querySelector('#title').textContent=pair('같은 F, 서로 다른 쓰임.','One F, two different uses.');document.querySelector('#intro').textContent=pair('별도 부모 브랜드를 만들지 않습니다. 기존 Digest의 F와 인용 괄호를 공유하고, Agent에 작은 구분을 더합니다. 앱 아이콘 교체 전 비교용 제안입니다.','No separate parent brand. Both apps share the existing Digest F and citation brackets, with a small distinction for Agent. These are proposals for comparison before replacing any app icon.');document.querySelector('#digest-caption').textContent=pair('기존 앱 아이콘과 웹 표식 유지 · 녹색 인용 괄호 · 공시 읽기','Existing app icon and web mark preserved · Green citation brackets · Filing reading');document.querySelector('#agent-caption').textContent=pair(`잉크빛 청색과 ${details[variant-1][0]} · 질문이 이어지는 조사`,`Ink blue with ${details[variant-1][1]} · Investigations with follow-up questions`);document.querySelector('#rules').textContent=pair('공통: F의 형태, 인용 괄호, 종이와 잉크의 바탕. 차이: Digest는 읽는 문서의 여백, Agent는 질문과 수치의 정렬. 작은 아이콘만으로 구별하도록 요구하지 않고, 항상 서비스 이름을 함께 표시합니다.','Shared: the F, citation brackets, paper and ink. Distinct: reading space in Digest, aligned questions and figures in Agent. Service names remain visible so a small icon is never the only identifier.');});
</script></body></html>
