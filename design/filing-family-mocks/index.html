<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filing · 다섯 가지 디자인 비교</title><link rel="stylesheet" href="picker.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ee;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#242320}.review{min-height:76px;padding:12px 24px;display:flex;gap:20px;align-items:center;border-bottom:1px solid #aaa69e;background:#fffdf8}.review strong{display:block;font-size:14px}.review p{margin:4px 0 0;color:#55524e;font-size:12px}.views{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}button,a{font:inherit} .views button,.standalone{padding:9px 12px;border:1px solid #88847a;background:transparent;color:inherit;cursor:pointer;text-decoration:none;min-height:40px}.views button[aria-pressed=true]{background:#242320;color:white}.standalone{white-space:nowrap}iframe{display:block;width:100%;height:calc(100dvh - 77px);border:0}button:focus-visible,a:focus-visible{outline:3px solid #356285;outline-offset:3px}@media(max-width:700px){.review{padding:10px 12px;gap:8px;flex-wrap:wrap}.review>div:first-child{width:100%}.views{margin:0}.views button,.standalone{font-size:12px;padding:6px 9px}iframe{height:calc(100dvh - 123px)}}
</style></head><body>
<header class="review"><div><strong id="direction">Filing · 디자인 비교</strong><p id="description">게시 전 목업 · 하단 1–5로 비교</p></div><nav class="views" aria-label="비교할 화면"><button data-view="digest" aria-pressed="true">Digest</button><button data-view="agent" aria-pressed="false">Agent</button><button data-view="icons" aria-pressed="false">아이콘</button></nav><a class="standalone" target="_blank" rel="noopener">전체 화면</a></header>
<iframe id="stage" title="선택한 Filing 디자인 목업"></iframe>
<nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" aria-label="1 원형" data-active aria-current="true">원형</button><button class="proto-picker-item" aria-label="2 서문">서문</button><button class="proto-picker-item" aria-label="3 명료">명료</button><button class="proto-picker-item" aria-label="4 대조">대조</button><button class="proto-picker-item" aria-label="5 실무">실무</button></nav>
<script type="module">
import {directions} from './variants.js';
const q=new URLSearchParams(location.search);let current=Math.min(4,Math.max(0,(Number(q.get('v'))||1)-1));let view=['digest','agent','icons'].includes(q.get('view'))?q.get('view'):'digest';let lang=q.get('lang')||localStorage.getItem('filing-mock-language')||(navigator.language.startsWith('ko')?'ko':'en');
const picker=document.querySelector('.proto-picker'),items=[...picker.querySelectorAll('button')],highlight=picker.querySelector('span'),frame=document.querySelector('iframe');
function move(){highlight.style.width=items[current].offsetWidth+'px';highlight.style.transform=`translateX(${items[current].offsetLeft}px)`}
function render(){const u=new URL(location);u.searchParams.set('v',current+1);u.searchParams.set('view',view);u.searchParams.set('lang',lang);history.replaceState(null,'',u);items.forEach((b,i)=>{b.toggleAttribute('data-active',i===current);if(i===current)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.querySelector('#direction').textContent=`${current+1}. ${directions[current].name} · ${directions[current].axis}`;document.querySelector('#description').textContent=directions[current].tradeoff;let src=`${view}.html?v=${current+1}&lang=${lang}`;frame.src=src;document.querySelector('.standalone').href=src;move()}
function keys(e){if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;let n=Number(e.key);if(n>=1&&n<=5){current=n-1;render()}else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){current=(current+(e.key==='ArrowRight'?1:4))%5;render()}}
items.forEach((b,i)=>b.onclick=()=>{current=i;render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.addEventListener('keydown',keys);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.type==='language'){lang=e.data.lang;localStorage.setItem('filing-mock-language',lang);const u=new URL(location);u.searchParams.set('lang',lang);history.replaceState(null,'',u);document.querySelector('.standalone').href=`${view}.html?v=${current+1}&lang=${lang}`}if(e.data.type==='variant'){current=(current+e.data.delta+5)%5;render()}if(e.data.type==='selectVariant'&&e.data.index>=0&&e.data.index<5){current=e.data.index;render()}});window.addEventListener('resize',move);render();requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script></body></html>
