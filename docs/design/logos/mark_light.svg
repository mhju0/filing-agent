<svg xmlns="http://www.w3.org/2000/svg" width="533" height="370" viewBox="0 0 533 370" role="img" aria-labelledby="title description">
  <title id="title">Filing Agent mark for light backgrounds</title>
  <desc id="description">The Filing family F mark with Filing Agent brown citation brackets</desc>
  <defs>
    <clipPath id="brackets">
      <rect x="0" y="0" width="110" height="370"/>
      <rect x="430" y="0" width="103" height="370"/>
    </clipPath>
    <filter id="agent-accent" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#87482e" result="accent"/>
      <feComposite in="accent" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <image width="533" height="370" href="data:image/png;base64,"/>
  <g clip-path="url(#brackets)" filter="url(#agent-accent)">
    <image width="533" height="370" href="data:image/png;base64,"/>
  </g>
</svg>

