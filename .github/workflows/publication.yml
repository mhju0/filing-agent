name: Publication checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publication:
    name: Publication boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 release/check_publication.py

  application:
    name: Application regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filing_agent
          POSTGRES_DB: filing_agent_slice
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U filing_agent -d filing_agent_slice"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: slice/web/package-lock.json
      - run: python -m pip install -r slice/requirements.lock
      - run: python -m unittest discover -s bench/tests -v
      - run: python -m unittest discover -s slice/tests -v
      - run: npm ci && npm run build
        working-directory: slice/web
