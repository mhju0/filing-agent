name: Publication checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publication:
    name: Publication boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 release/check_publication.py
